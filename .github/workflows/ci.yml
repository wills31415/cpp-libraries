# Chaque bibliothèque est compilée et testée sur trois compilateurs et deux
# bibliothèques standard, en Debug (ASan + UBSan) et en Release, avertissements
# traités comme des erreurs. Chaque test tourne en C++23 (voir wsl_add_test dans
# CMakeLists.txt).
#
# Les configurations « FMA » sont hostiles exprès : fma matérielle disponible et
# contraction de a*b + c permise partout (-ffp-contract=fast). Les empreintes de
# tests/test_special_bitexact.cpp doivent y être les mêmes qu'ailleurs : c'est la
# preuve que la garantie bit-exacte de wsl::special résiste aux options du
# projet consommateur. Elles ne tournent qu'en Release : la garantie bit-exacte
# s'y vérifie, et les sanitizers sont couverts par les jobs Debug sans FMA.
#
# Debug en -O1 : ASan et UBSan restent efficaces, tests 2 à 3 fois plus rapides.
#
# Seul ce qu'un push peut avoir changé est compilé et testé : le job « changes »
# liste les chemins modifiés depuis le dernier passage réussi (tools/ci/changed_files.sh),
# et CMake n'en garde que les bibliothèques touchées et celles qui en dépendent
# (cmake/affected.cmake). Documentation seule : rien. Infrastructure, tag, lancement
# manuel ou passage hebdomadaire : tout.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Chemins modifiés
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.list.outputs.files }}
      tests: ${{ steps.list.outputs.tests }}
      package: ${{ steps.list.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci/changed_files.sh changed.txt
          relevant=$(grep -v -E -f cmake/ci_ignored_paths.txt changed.txt || true)
          tests=false; package=false
          if [ -n "$relevant" ]; then package=true; fi
          if [ -n "$(printf '%s\n' "$relevant" | grep -v '^tests/package/' | grep -v '^$' || true)" ]; then tests=true; fi
          { echo "files<<FIN"; cat changed.txt; echo "FIN"; } >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Tests : $tests ; paquet : $package"

  test:
    name: ${{ matrix.compiler.name }} · ${{ matrix.preset }}
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ matrix.compiler.os }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "GCC 14", os: ubuntu-24.04, cxx: g++-14, flags: "" }
          - { name: "Clang 18", os: ubuntu-24.04, cxx: clang++-18, flags: "" }
          - { name: "Apple Clang", os: macos-latest, cxx: /usr/bin/clang++, flags: "" }
          - { name: "GCC 14 FMA", os: ubuntu-24.04, cxx: g++-14, flags: "-march=x86-64-v3 -ffp-contract=fast" }
          - { name: "Clang 18 FMA", os: ubuntu-24.04, cxx: clang++-18, flags: "-march=x86-64-v3 -ffp-contract=fast" }
          - { name: "Apple Clang FMA", os: macos-latest, cxx: /usr/bin/clang++, flags: "-ffp-contract=fast" }
        preset: [debug, release]
        exclude:
          - { compiler: { name: "GCC 14 FMA", os: ubuntu-24.04, cxx: g++-14, flags: "-march=x86-64-v3 -ffp-contract=fast" }, preset: debug }
          - { compiler: { name: "Clang 18 FMA", os: ubuntu-24.04, cxx: clang++-18, flags: "-march=x86-64-v3 -ffp-contract=fast" }, preset: debug }
          - { compiler: { name: "Apple Clang FMA", os: macos-latest, cxx: /usr/bin/clang++, flags: "-ffp-contract=fast" }, preset: debug }
    steps:
      - uses: actions/checkout@v4

      # uv engendre les valeurs de référence de wsl::special (mpmath), non versionnées.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Compilateur
        run: |
          ${{ matrix.compiler.cxx }} --version
          cmake --version
          uname -m

      - name: Chemins modifiés
        env:
          FILES: ${{ needs.changes.outputs.files }}
        run: printf '%s\n' "$FILES" > "$RUNNER_TEMP/changed.txt"

      - name: Configuration
        run: >
          cmake --preset ${{ matrix.preset }}
          "-DWSL_AFFECTED_BY=${{ runner.temp }}/changed.txt"
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}"
          -DWSL_WERROR=ON
          "-DCMAKE_CXX_FLAGS_DEBUG=-g -O1"

      - name: Compilation
        run: cmake --build --preset ${{ matrix.preset }} -j 4

      - name: Tests
        run: ctest --preset ${{ matrix.preset }} -j 4 --no-tests=ignore

  package:
    name: Paquet CMake (installation, FetchContent)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installation
        run: |
          cmake -S . -B build/install -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release \
                -DWSL_BUILD_TESTS=OFF -DWSL_BUILD_EXAMPLES=OFF
          cmake --install build/install --prefix "$RUNNER_TEMP/prefix"

      - name: find_package
        run: |
          cmake -S tests/package -B build/consumer-package -DCMAKE_CXX_COMPILER=g++-14 \
                -DMODE=package -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build build/consumer-package
          ctest --test-dir build/consumer-package --output-on-failure

      - name: FetchContent
        run: |
          cmake -S tests/package -B build/consumer-subdirectory -DCMAKE_CXX_COMPILER=g++-14 \
                -DMODE=subdirectory
          cmake --build build/consumer-subdirectory
          ctest --test-dir build/consumer-subdirectory --output-on-failure
